---
- name: Install all
  hosts: all
  gather_facts: true
  become: false

  roles:
    # Classifies the machine into mac_family / mac_battery_installed /
    # mac_is_vm / mac_is_always_on before any role runs. It is ALSO a meta
    # dependency of openclaw, hermes and claude-mem — that wiring is what makes
    # a standalone `ansible localhost -m include_role -a name=openclaw` work
    # with no extra vars. This entry is belt-and-braces so the full play still
    # classifies first however the list below is reordered; Ansible
    # de-duplicates it, so it runs exactly once either way.
    - host-facts
    - homebrew
    - github
    - oh-my-zsh
    - direnv
    - uv
    - python
    - go
    - nodejs
    - bun
    - rust
    - jdk
    - claude-code
    - claude-extras
    - codex
    - gemini
    - opencode
    - kimi-code
    - skills
    - agent-reach
    - playwright
    - playwright-cli
    - intellij-idea
    - webstorm
    - openclaw
    - claude-mem
    - cc-switch
    - omp
    - pi
    - hermes
    - role: paseo
      tags: [agent-multiplexer]
    - ghostty
    - cmux
    - obsidian
    - cloudflare
    - multica-cli
    - tailscale
    - apple-container
    - role: moshi
      tags: [agent-multiplexer]
    - role: zellij
      tags: [terminal-multiplexer]
    - role: tmux
      tags: [terminal-multiplexer]
    - role: herdr
      tags: [terminal-multiplexer]

