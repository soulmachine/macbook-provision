---
# agent-desktop (github.com/vercel-labs/agent-desktop): the computer-use fallback ~/.agents/AGENTS.md
# names, an npm global. Its Accessibility and Screen Recording grants need someone at the screen.
- name: Install agent-desktop from npm
  ansible.builtin.include_role:
    name: nodejs
    tasks_from: npm_global
  vars:
    nodejs_npm_package: agent-desktop
    nodejs_npm_cmd: agent-desktop
