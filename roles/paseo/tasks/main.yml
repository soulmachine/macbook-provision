---
# Two install paths, split on the `host-facts` always-on gate:
#   MacBook (mac_is_always_on false) — the `paseo` cask: Paseo.app, the desktop UI,
#                                      which bundles its own daemon and CLI.
#   always-on Mac, or not macOS      — `@getpaseo/cli` from npm: the CLI and the daemon,
#                                      which serves the web UI itself. No desktop app on
#                                      a box nobody sits at, so the cask is removed there.
#                                      On macOS the daemon runs under a LaunchAgent this
#                                      role owns (bottom of this file).
# The npm package is upstream's documented server install and tracks the same version
# as the cask.
- name: Ensure platform fact is gathered
  ansible.builtin.setup:
    gather_subset: platform
  when: ansible_facts['system'] is not defined

- name: Decide whether this host gets the Paseo desktop app
  ansible.builtin.set_fact:
    paseo_desktop: "{{ ansible_facts['system'] == 'Darwin' and not (mac_is_always_on | bool) }}"

# `brew uninstall --cask paseo` runs the cask's uninstall stanza, which includes
# `paseo daemon stop --force` — so removing it stops the running daemon. The
# restart at the bottom of this file brings it back on the npm install.
- name: Install or remove the Paseo desktop app
  community.general.homebrew_cask:
    name: paseo
    state: "{{ 'latest' if paseo_desktop | bool else 'absent' }}"
  register: paseo_cask
  when: ansible_facts['system'] == 'Darwin'

# Same gate as the obsidian and playwright-cli roles: `npm install -g` prints the same
# line for a no-op and a real upgrade, so diff `npm ls -g` around it. An absent package
# exits 1, hence `failed_when: false` on the read, so a first install reads as a change.
- name: Install the Paseo CLI and daemon from npm
  when: not (paseo_desktop | bool)
  block:
    - name: Read the installed Paseo CLI version
      ansible.builtin.command: npm ls -g --depth=0 --json @getpaseo/cli
      register: paseo_cli_before
      changed_when: false
      failed_when: false

    - name: Install the Paseo CLI globally # noqa: command-instead-of-module
      ansible.builtin.command: npm install -g @getpaseo/cli@latest
      changed_when: false

    - name: Check whether the Paseo CLI changed
      ansible.builtin.command: npm ls -g --depth=0 --json @getpaseo/cli
      register: paseo_cli_after
      changed_when: paseo_cli_after.stdout != paseo_cli_before.stdout

# Five hosts carried a hand-written `"npm:@getpaseo/cli" = "0.8.0"` in mise's global
# config, which shadowed both the cask and the npm global on PATH. Removing it leaves
# one install path per host. `mise unuse` only edits the config and leaves the 0.8.0
# tree (about 470 MB) on disk, measured 2026-10-04, so `mise prune` follows it. It runs
# after the npm install so a `paseo` is already on PATH when the pinned one goes. Gated
# on a read of the global config, so `changed` means the pin was really there.
# `check_mode: false`: the read is harmless, and without it `from_json` below would
# parse the empty stdout of a skipped command under `--check`.
- name: Read mise's global tool pins
  ansible.builtin.command: mise ls --global --json
  register: paseo_mise_global
  changed_when: false
  check_mode: false

- name: Remove the mise pin on the Paseo CLI
  ansible.builtin.shell: mise unuse --global npm:@getpaseo/cli && mise prune --yes npm:@getpaseo/cli
  register: paseo_mise_pin
  changed_when: true
  when: "'npm:@getpaseo/cli' in (paseo_mise_global.stdout | from_json)"

# On an always-on Mac the role owns the `sh.paseo.daemon` LaunchAgent (DECISIONS Q176),
# so every such host runs the daemon. Before this it was hand-written on five hosts
# and missing on mac-mini-m6. `files/sh.paseo.daemon.plist` is byte-identical to the
# hand-written agent after its move off `--foreground`, which 0.10 removed, so a host
# already on that version keeps its daemon running untouched.
#
# The plist launches `paseo` by name through a login shell, so every start picks up
# whatever install is current. That is what survives a Node upgrade: the nodejs role's
# `mise upgrade node` deletes the old Node version along with this npm global, the
# install above then reads as a change, and the daemon restarts on the new one.
- name: Run the Paseo daemon under launchd
  when:
    - ansible_facts['system'] == 'Darwin'
    - not (paseo_desktop | bool)
  block:
    # `copy` will not create a missing parent, and a new account has no LaunchAgents dir.
    # Symbolic mode on purpose: the fleet has both 700 and 755 here, and an octal mode
    # would rewrite one or the other on every host that differs.
    - name: Ensure the LaunchAgents directory exists
      ansible.builtin.file:
        path: ~/Library/LaunchAgents
        state: directory
        mode: u+rwx

    - name: Install the Paseo daemon LaunchAgent
      ansible.builtin.copy:
        src: sh.paseo.daemon.plist
        dest: ~/Library/LaunchAgents/sh.paseo.daemon.plist
        mode: "0644"
      register: paseo_agent_plist

    # The relay (relay.paseo.sh, end-to-end encrypted) is the only way a paired phone or
    # laptop reaches this daemon, which listens on 127.0.0.1 alone. Paseo defaults it to
    # off. `config set` only saves `~/.paseo/config.json`; its own output says it is
    # "not applied to a running daemon", so the reload below picks it up. On a new
    # host it writes the file before the daemon's first start. Pairing stays manual:
    # the `paseo daemon pair` link is a per-host secret.
    # `default('{}', true)`: under `--check` the skipped read leaves an empty stdout.
    - name: Read whether the Paseo relay is enabled
      ansible.builtin.command: paseo daemon config get daemon.relay.enabled
      register: paseo_relay
      changed_when: false

    - name: Enable the Paseo relay
      ansible.builtin.command: paseo daemon config set daemon.relay.enabled true
      register: paseo_relay_set
      changed_when: true
      when: (paseo_relay.stdout | default('{}', true) | from_json).value | default(false) is not sameas true

    # rc 113 is launchd's "no such service": the agent is not loaded. That includes an
    # agent someone unloaded on purpose, which the next run loads again.
    - name: Read whether the Paseo daemon LaunchAgent is loaded
      ansible.builtin.shell: launchctl print "gui/$(id -u)/sh.paseo.daemon" >/dev/null
      register: paseo_agent_loaded
      changed_when: false
      failed_when: paseo_agent_loaded.rc not in [0, 113]
      check_mode: false

    # Reload on any change above. A relay change needs it to take effect, and each of
    # the others leaves the daemon stopped or running deleted code: the cask's uninstall
    # stanza runs `paseo daemon stop --force`, an npm install replaces its files, and
    # the pin removal prunes the tree it started from.
    # bootout + bootstrap, not `kickstart -k`: launchd caches the plist, so a kickstart
    # would restart the old command line. bootout returns before the daemon's roughly
    # 6s graceful shutdown ends, and a bootstrap issued in that window fails with rc 5,
    # so wait up to 30s for launchd to drop the service first.
    - name: Load or reload the Paseo daemon LaunchAgent
      ansible.builtin.shell: |
        svc="gui/$(id -u)/sh.paseo.daemon"
        if launchctl print "$svc" >/dev/null 2>&1; then
          launchctl bootout "$svc"
          for _ in $(seq 60); do launchctl print "$svc" >/dev/null 2>&1 || break; sleep 0.5; done
        fi
        launchctl bootstrap "gui/$(id -u)" ~/Library/LaunchAgents/sh.paseo.daemon.plist
      changed_when: true
      when: >-
        paseo_agent_loaded.rc != 0 or paseo_agent_plist is changed or paseo_relay_set is changed
        or paseo_cask is changed or paseo_cli_after is changed or paseo_mise_pin is changed

    # A loaded agent is not a running daemon. archs-mac-mini's crash-looped for a week
    # (`Failed to acquire PID lock`, exit 1 every ThrottleInterval) while `launchctl print`
    # still found it, so the loaded check above saw nothing wrong. Ask the daemon itself,
    # allowing up to 60s for a start or restart above to come up. On this ansible-core,
    # `failed_when: false` holds even when the retries run out (verified 2026-10-04), so a
    # down daemon is recorded, not raised. main.yml's post_tasks fail the play on it, so
    # the roles after this one still run (see the comment there).
    - name: Read whether the Paseo daemon is running
      ansible.builtin.command: paseo daemon status --json
      register: paseo_daemon_status
      changed_when: false
      failed_when: false
      retries: 12
      delay: 5
      until: (paseo_daemon_status.stdout | default('{}', true) | from_json).localDaemon | default('') == 'running'

    # A host fact, not a role var, so main.yml's post_tasks can read it.
    - name: Record a Paseo daemon that is not running
      ansible.builtin.set_fact:
        paseo_daemon_down: >-
          The Paseo daemon is not running (localDaemon:
          {{ (paseo_daemon_status.stdout | default('{}', true) | from_json).localDaemon | default('no status') }})
          after 60s of waiting. `launchctl print gui/$(id -u)/sh.paseo.daemon` shows launchd's
          last exit code, and /tmp/paseo-daemon.err the daemon's own error. archs-mac-mini's
          week-long outage in 2026-09 was a stale, empty ~/.paseo/paseo.pid.
      when:
        - paseo_daemon_status is not skipped
        - (paseo_daemon_status.stdout | default('{}', true) | from_json).localDaemon | default('') != 'running'

    # post_tasks only run in a full play, so a single-role run would never see the failure
    # there. The skills role reports its deferred failures the same way.
    - name: Report a Paseo daemon that is not running
      ansible.builtin.debug:
        msg: "{{ paseo_daemon_down }}"
      when: paseo_daemon_down is defined
