---
# The old gate read `'added' in stdout or 'updated' in stdout`, which is never true here:
# `npm install -g` prints `changed N packages in <time>` on a converged run *and* on a real
# upgrade alike — measured 2026-09-16, a 0.19.2 → 0.19.3 upgrade of another package was
# indistinguishable from a no-op. So this role reported `ok` through every Playwright
# upgrade it performed. Diff the installed version instead, per CLAUDE.md "Self-update
# tasks: diff state, don't grep output". An absent package prints `{"name": "lib"}` and
# exits 1, hence `failed_when: false` on the read, so a first install reads as a change.
- name: Read the installed Playwright version
  ansible.builtin.command: npm ls -g --depth=0 --json playwright
  register: playwright_npm_before
  changed_when: false
  failed_when: false

- name: Install Playwright globally
  ansible.builtin.command: npm install -g playwright@latest
  changed_when: false

- name: Check whether Playwright changed
  ansible.builtin.command: npm ls -g --depth=0 --json playwright
  register: playwright_npm_after
  changed_when: playwright_npm_after.stdout != playwright_npm_before.stdout

# `playwright install` locks the shared browser cache (__dirlock in
# ~/Library/Caches/ms-playwright) at the top of its install(), *before* it checks
# whether any browser is actually missing. So even a fully converged machine
# contends for that lock, and when another Playwright holds it — a coding agent's
# bundled copy, a project's node_modules — this role used to die after ~8 minutes
# with "An active lockfile is found" while having had nothing to do.
#
# `--dry-run` takes no lock (it returns in under a second against a held lock) and
# prints the resolved install directory of every component `chromium` pulls in: the
# browser, the headless shell and ffmpeg. Playwright drops an INSTALLATION_COMPLETE
# marker in each directory once that component is fully unpacked, so the markers
# answer "is there anything to install?" without ever touching the lock.
- name: Check whether Playwright Chromium is already installed
  ansible.builtin.shell: |
    set -o pipefail
    found=0
    missing=0
    while IFS= read -r dir; do
      found=1
      [ -f "$dir/INSTALLATION_COMPLETE" ] || missing=1
    done < <(playwright install chromium --dry-run |
             sed -n 's/^ *Install location: *//p')
    [ "$found" -eq 1 ] || exit 2
    exit "$missing"
  args:
    executable: /bin/bash
  register: playwright_browsers
  changed_when: false
  # Read-only (it takes no lock and writes nothing), and the install task's
  # condition depends on it, so run it under --check too rather than letting that
  # condition silently evaluate false against an unregistered result.
  check_mode: false
  # rc 0 = every component present, 1 = at least one missing. Anything else means
  # --dry-run itself failed (or printed no install locations), which must be loud
  # rather than silently downgraded to "nothing to install".
  failed_when: playwright_browsers.rc not in [0, 1]

# Do NOT resolve a lock conflict by deleting __dirlock, despite Playwright's error
# message suggesting exactly that. Playwright locks via proper-lockfile with its
# default 10s stale threshold and a 5s refresh, so it already reclaims a *crashed*
# installer's lock by itself. A lock still standing therefore has a live holder, and
# removing it would let two installs unpack into the same directory at once.
# Retrying is the only safe response — and each attempt already sits through
# Playwright's own ~10 minutes of exponential back-off before giving up, so keep the
# retry count low: this is a slow path, entered only when a browser is genuinely
# missing *and* something else is mid-install.
- name: Install Playwright Chromium
  ansible.builtin.command: playwright install chromium
  register: playwright_install
  when: playwright_browsers.rc == 1
  until: playwright_install.rc == 0
  retries: 2
  delay: 30
  # `changed_when: true`, not a stdout match. This task runs only when the check above
  # found a component with no INSTALLATION_COMPLETE marker, so reaching it at all means
  # something was genuinely missing and a successful run installed it. The old gate read
  # `'downloading' in stdout`, which adds a second, weaker test on top of the `when:` that
  # already decided this: Playwright can unpack a component it already has in the browser
  # cache without printing that word, and the role would then have installed a browser and
  # reported nothing. A failure still fails the task — this only labels the success.
  changed_when: true
