---
- name: Install Ego Lite
  ansible.builtin.include_tasks: install.yml

# The updater needs an onboarded app; install.yml sets the fact.
- name: Upgrade Ego Lite
  ansible.builtin.include_tasks: upgrade.yml
  when: ego_browser_onboarded
  vars:
    ego_browser_bin: "{{ lookup('env', 'HOME') }}/.local/bin/ego-browser"
