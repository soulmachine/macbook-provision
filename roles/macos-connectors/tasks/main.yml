---
# CLIs that stand in for Apple connectors, so an agent can reach Reminders, Messages,
# Notes, Calendar, Contacts, Mail, Maps and Phone on the Mac. The list comes from
# https://x.com/Kevin_Logan/status/2109271248714784841. Photos and Find My have no CLI there.
#
#   remindctl  https://github.com/openclaw/remindctl          (steipete/tap)
#   imsg       https://github.com/openclaw/imsg               (steipete/tap)
#   memo       https://github.com/antoniorodr/memo            (antoniorodr/memo)
#   apple-calendar, apple-contacts, apple-mail, apple-maps, apple-phone
#              https://github.com/danielhopkins/apple-tools   (danielhopkins/formulae)
#   mas        https://github.com/mas-cli/mas                 (homebrew-core)  Mac App Store
#
# The macOS permission grants (Reminders/Calendar/Contacts prompts, Full Disk Access and
# Automation for the terminal) are a one-time manual step per host; `apple status` lists them.
# For imsg, the `imsg-permissions` skill grants and tests them from every parent that runs imsg.
# `state: latest` below upgrades imsg, and an upgrade drops its path-based grants: rerun the skill.

- name: Tap the macOS connector taps
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  loop: "{{ macos_connectors_taps }}"

# Homebrew refuses to load formulae from untrusted third-party taps
# (HOMEBREW_REQUIRE_TAP_TRUST). Gated on the trust ledger, not on the command's
# wording — see roles/cc-switch/tasks/main.yml for the full reasoning.
- name: Read the trusted Homebrew entries
  ansible.builtin.command: brew trust --json v1
  register: _macos_connectors_trusted
  changed_when: false
  failed_when: false
  check_mode: false

- name: Trust the macOS connector taps
  ansible.builtin.command:
    cmd: brew trust --tap {{ item }}
  loop: "{{ macos_connectors_taps }}"
  when: >-
    item not in
    ((_macos_connectors_trusted.stdout | default('{}', true) | from_json).taps | default([]))
  changed_when: true

- name: Install the macOS connector CLIs
  community.general.homebrew:
    name:
      - steipete/tap/remindctl
      - steipete/tap/imsg
      - antoniorodr/memo/memo
      - danielhopkins/formulae/apple-tools
      - mas
    state: latest
