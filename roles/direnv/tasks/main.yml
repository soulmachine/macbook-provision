---
- name: Install direnv
  community.general.homebrew:
    name: direnv
    state: latest

# Replaces the oh-my-zsh direnv plugin. Interactive shells only, by design: see the
# dotenv role for what non-interactive ones get instead.
- name: Hook direnv into .zshrc
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.zshrc"
    line: 'eval "$(direnv hook zsh)"'
    regexp: 'direnv hook zsh'
