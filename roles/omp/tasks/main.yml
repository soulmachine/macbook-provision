---
- name: Install oh-my-pi
  ansible.builtin.command: bun install -g @oh-my-pi/pi-coding-agent
  environment:
    PATH: "{{ lookup('env', 'HOME') }}/.bun/bin:{{ lookup('env', 'PATH') }}"
  args:
    creates: "{{ lookup('env', 'HOME') }}/.bun/bin/omp"

- name: Check installed oh-my-pi version
  ansible.builtin.command: "{{ lookup('env', 'HOME') }}/.bun/bin/omp --version"
  register: omp_version_before
  changed_when: false

# `@latest` on purpose: the recorded dependency range (^x.y.z) would keep
# `bun update -g` from ever crossing a major version. Bun prints the same
# "installed ...@<version>" line whether or not anything changed, so change
# is detected by comparing against the version installed before.
- name: Update oh-my-pi
  ansible.builtin.command: "{{ lookup('env', 'HOME') }}/.bun/bin/bun install -g @oh-my-pi/pi-coding-agent@latest"
  register: omp_update
  changed_when: >-
    'installed @oh-my-pi/pi-coding-agent@' ~ (omp_version_before.stdout.split('/') | last)
    not in omp_update.stdout

- name: Add omp-yolo alias to .zshrc
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.zshrc"
    line: 'alias omp-yolo="omp --thinking=xhigh --yolo"'
    regexp: '^alias omp-yolo='
    state: present

- name: Add omp shell completions to .zshrc
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.zshrc"
    line: eval "$(omp completions zsh)"
    regexp: omp completions zsh
    state: present
