---
# ponytail — https://github.com/DietrichGebert/ponytail — a "lazy senior dev"
# ruleset plus the /ponytail* commands, shipped as a plugin for many agent
# hosts. This role installs it into every agent this repo provisions, through
# that agent's own installer (never a shared skills-dir copy), one task file
# per host. Each file converges the install behind an idempotent gate and then
# refreshes it by diffing observable state around the host's own updater —
# AGENTS.md "Self-update tasks: diff state, don't grep output". kimi-code is
# absent because neither it nor ponytail offers a mechanism to install into.
- name: Install ponytail into Claude Code
  ansible.builtin.include_tasks: claude-code.yml

- name: Install ponytail into Codex
  ansible.builtin.include_tasks: codex.yml

- name: Install ponytail into OpenCode
  ansible.builtin.include_tasks: opencode.yml

- name: Install ponytail into pi
  ansible.builtin.include_tasks: pi.yml

- name: Install ponytail into oh-my-pi
  ansible.builtin.include_tasks: omp.yml

# Hermes is installed only on always-on machines (see its role), so elsewhere
# there is nothing to install ponytail into. Same gate, same fact, same
# `| bool` cast; `host-facts` is a meta dependency of this role for the
# standalone-run reason documented in roles/hermes/tasks/main.yml.
- name: Install ponytail into Hermes
  ansible.builtin.include_tasks: hermes.yml
  when: mac_is_always_on | bool

# Defaulted as belt-and-braces, like the hermes role's message: the
# `host-facts` dependency always defines `mac_family`, so the default only
# covers a play that reaches this task without that role. Safe for a display
# string, never for the gate above.
- name: Report that the Hermes half was skipped
  ansible.builtin.debug:
    msg: >-
      Skipping ponytail's Hermes half on this
      {{ mac_family | default('machine') }} — Hermes is installed on every Mac
      except a MacBook.
  when: not (mac_is_always_on | bool)
