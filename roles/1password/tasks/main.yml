---
# Only the hosts that hold ~/personal-agent (m6, m2, macbook-air; ~/.agents/docs/fleet-ssh.md)
# get 1Password. The gate lives here, not as a `when:` in main.yml, so it holds for a
# single-role run too, the same shape as the hermes role.
- name: Check for ~/personal-agent
  ansible.builtin.stat:
    path: "{{ onepassword_home }}/personal-agent"
  register: onepassword_personal_agent

- name: Install 1Password
  ansible.builtin.include_tasks: install.yml
  when: onepassword_personal_agent.stat.exists

- name: Report that 1Password was skipped
  ansible.builtin.debug:
    msg: Skipping 1Password, because this host has no ~/personal-agent.
  when: not onepassword_personal_agent.stat.exists
