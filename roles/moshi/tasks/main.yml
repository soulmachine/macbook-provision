---
# moshi-hook — installed from the third-party tap rjyo/moshi and run as a
# Homebrew background service. References:
#   - https://github.com/rjyo/homebrew-moshi
#   - https://getmoshi.app/docs/hooks#install-on-macos
#
# Implemented as the literal brew command sequence (tap -> trust -> install ->
# services start). Each command is guarded so the role stays idempotent — bare
# brew commands otherwise re-run and re-report "changed" on every pass.

# brew tap rjyo/moshi
- name: Locate the Homebrew repository (for the tap path)
  ansible.builtin.command:
    cmd: brew --repository
  register: moshi_brew_repo
  changed_when: false
  check_mode: false # read-only probe; run in --check so the tap's creates path is real

- name: Tap rjyo/moshi
  ansible.builtin.command:
    cmd: brew tap rjyo/moshi
    creates: "{{ moshi_brew_repo.stdout }}/Library/Taps/rjyo/homebrew-moshi"

# brew trust rjyo/moshi
# Homebrew refuses to load formulae from untrusted third-party taps
# (HOMEBREW_REQUIRE_TAP_TRUST), so this must run before install.
#
# Gated on the trust ledger that `brew trust --json v1` prints, not on the command's
# wording — see roles/cc-switch/tasks/main.yml for the full reasoning. The old gate was a
# negated stdout sentinel, the shape CLAUDE.md rules out.
- name: Read the trusted Homebrew entries
  ansible.builtin.command: brew trust --json v1
  register: _moshi_trusted
  changed_when: false
  failed_when: false
  check_mode: false

- name: Trust rjyo/moshi
  ansible.builtin.command:
    cmd: brew trust --tap rjyo/moshi
  when: >-
    'rjyo/moshi' not in
    ((_moshi_trusted.stdout | default('{}', true) | from_json).taps | default([]))
  changed_when: true

# brew install moshi-hook
- name: Check whether moshi-hook is installed
  ansible.builtin.command:
    cmd: brew list --versions moshi-hook
  register: _moshi_installed
  changed_when: false
  failed_when: false
  check_mode: false # read-only probe; run in --check so the install guard sees real state

- name: Install moshi-hook
  ansible.builtin.command:
    cmd: brew install moshi-hook
  when: _moshi_installed.rc != 0
  # Gated on the probe above, so reaching this task means moshi-hook is absent
  # and the install really does change something.
  changed_when: true

# brew services start moshi-hook
- name: Check whether the moshi-hook service is running
  ansible.builtin.command:
    cmd: brew services info moshi-hook --json
  register: _moshi_service
  changed_when: false
  failed_when: false
  check_mode: false # read-only probe; run in --check so the service guard sees real state

- name: Start moshi-hook service
  ansible.builtin.command:
    cmd: brew services start moshi-hook
  when: >
    (_moshi_service.stdout | default('[]', true) | from_json
     | selectattr('running', 'equalto', true) | list | length) == 0
  # Gated on the service being stopped, so reaching this task means starting it
  # really does change something.
  changed_when: true
