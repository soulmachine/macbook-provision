---
# One pimalaya tool (himalaya or ortie) from its GitHub release: the same shape as the purelymail
# role, parametrised. `pimalaya_tool` comes from the include, `pimalaya_os` from vars/main.yml.
# The tarball holds the binary at its root plus share/ (man pages, completions, schemas), which
# this does not install.

- name: Read the installed {{ pimalaya_tool }} version
  ansible.builtin.command: "{{ lookup('env', 'HOME') }}/.local/bin/{{ pimalaya_tool }} --version"
  register: pimalaya_installed
  changed_when: false
  failed_when: false
  check_mode: false # read-only probe; run in --check so the gate below sees real state

# The release page's redirect names the newest tag, so no GitHub API call and no rate limit.
- name: Resolve the latest {{ pimalaya_tool }} release
  ansible.builtin.uri:
    url: https://github.com/pimalaya/{{ pimalaya_tool }}/releases/latest
    follow_redirects: none
    status_code: [301, 302]
  register: pimalaya_release
  check_mode: false

# uname rather than ansible_facts, so `ansible localhost -m include_role` works without a
# fact-gathering play.
- name: Work out the {{ pimalaya_tool }} version and asset name
  ansible.builtin.set_fact:
    pimalaya_latest: "{{ pimalaya_release.location | regex_search('/tag/v([0-9][^/]*)$', '\\1') | first }}"
    pimalaya_arch: "{{ 'aarch64' if lookup('pipe', 'uname -m') in ['aarch64', 'arm64'] else 'x86_64' }}"

# `--version` is several lines; the first is `<tool> v<version> +feature ...`.
- name: Install or update {{ pimalaya_tool }}
  when: (pimalaya_installed.stdout_lines | default([]) | first | default('')) is not match('^' ~ pimalaya_tool ~ ' v' ~ pimalaya_latest ~ '( |$)')
  vars:
    pimalaya_asset: "{{ pimalaya_tool }}.{{ pimalaya_arch }}-{{ pimalaya_os }}.tgz"
    pimalaya_url: "https://github.com/pimalaya/{{ pimalaya_tool }}/releases/download/v{{ pimalaya_latest }}/{{ pimalaya_asset }}"
  block:
    - name: Ensure ~/.local/bin exists
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.local/bin"
        state: directory
        mode: "0755"

    # shortcut: the release publishes no checksum file, so this trusts GitHub's TLS; add
    # `checksum: sha256:<url>` if upstream ever ships one.
    - name: Download the {{ pimalaya_tool }} release tarball
      ansible.builtin.get_url:
        url: "{{ pimalaya_url }}"
        dest: "/tmp/{{ pimalaya_asset }}"
        mode: "0644"

    # tar itself, not the unarchive module: that module insists on GNU tar, and macOS ships
    # bsdtar. Only the binary member is extracted.
    - name: Unpack the {{ pimalaya_tool }} binary into ~/.local/bin # noqa: command-instead-of-module
      ansible.builtin.command: tar -xzf "/tmp/{{ pimalaya_asset }}" -C "{{ lookup('env', 'HOME') }}/.local/bin" {{ pimalaya_tool }}
      changed_when: true

    - name: Remove the downloaded tarball
      ansible.builtin.file:
        path: "/tmp/{{ pimalaya_asset }}"
        state: absent

# `changed` from the observable version: this is what proves the new binary answers.
- name: Check whether {{ pimalaya_tool }} changed
  ansible.builtin.command: "{{ lookup('env', 'HOME') }}/.local/bin/{{ pimalaya_tool }} --version"
  register: pimalaya_after
  changed_when: pimalaya_after.stdout != (pimalaya_installed.stdout | default(''))
