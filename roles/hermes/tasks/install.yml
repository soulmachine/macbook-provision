# Hermes — Nous Research's personal AI agent. https://github.com/NousResearch/hermes-agent
#
# The official installer clones the repo to ~/.hermes/hermes-agent, builds a
# uv-managed venv beside it, installs Playwright/Chromium and Node deps, then
# writes `hermes` / `hermes-acp` launchers into ~/.local/bin — appending that
# dir to .zshrc itself (grep-guarded), so no PATH task is needed here.
#
# `--skip-setup` is required for unattended runs: the setup wizard reads from
# /dev/tty rather than stdin, so under ansible-playbook it renders its prompts
# into Ansible's captured stdout and then blocks the play forever waiting on
# input nobody can see. Run `hermes setup` interactively once afterwards to
# configure the model provider and any messaging gateways.
#
# `--no-skills` keeps ~/.hermes/skills/ a blank slate. That directory is already
# a symlink farm into ~/.agents/skills maintained by the `skills` role; without
# this flag the installer seeds ~13 bundled skill *directories* alongside those
# symlinks and re-injects them on every `hermes update`.
- name: Install hermes # noqa: command-instead-of-module risky-shell-pipe
  ansible.builtin.shell: >-
    curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --skip-setup --no-skills
  args:
    creates: "{{ lookup('env', 'HOME') }}/.local/bin/hermes"

# `--no-skills` above only takes effect on a fresh install, and the `creates:`
# guard means the installer never runs again on a host provisioned before the
# flag was added — so converge the opt-out separately. All the flag really does
# is write ~/.hermes/.no-bundled-skills, the marker that skills_sync.py and
# `hermes update` both honor; `hermes skills opt-out` writes exactly that and
# touches nothing already on disk.
#
# Bundled skills seeded by an earlier flag-less run stay put. Clear them by
# hand with `hermes skills opt-out --remove` — it deletes only pristine,
# manifest-tracked bundled skills, never user-edited ones and never the
# `skills`-role symlinks — deliberately left out of the role so provisioning
# never deletes skills on its own.
- name: Opt out of hermes bundled-skill seeding
  ansible.builtin.command: "{{ lookup('env', 'HOME') }}/.local/bin/hermes skills opt-out"
  args:
    creates: "{{ lookup('env', 'HOME') }}/.hermes/.no-bundled-skills"

# Two tasks keep this both idempotent and fresh: `creates:` above installs once,
# and `hermes update` re-checks upstream every run. Use `update --check` for the
# probe, not `hermes version` — the latter's update status is cached for 6 hours
# in ~/.hermes/.update_check, while `--check` does a live `git fetch`.
#
# Gate on the POSITIVE sentinel. `update --check` prints "⚕ Update available…"
# only when the checkout is actually behind; it prints "✓ Already up to date."
# when converged, and exits 1 with a "✗ …" line on every failure branch
# (network error, auth failure, failed fetch, branch not found). A negated
# "not up to date" test would fire on all of those and burn a full reinstall on
# every converged run, so `failed_when: false` swallows the transient ones and
# the apply task simply doesn't trigger.
- name: Check whether a hermes update is available
  ansible.builtin.command: "{{ lookup('env', 'HOME') }}/.local/bin/hermes update --check"
  register: hermes_update_check
  changed_when: false
  failed_when: false

# `hermes update` is safe unattended: its two prompts (restore stashed local
# changes, add an 'upstream' remote for forks) read stdin — not /dev/tty — and
# both catch EOFError, so under Ansible they fall through to their safe default.
#
# But it EXITS 1 PRECISELY WHEN IT SUCCEEDS, so its exit code cannot decide this
# task. It git-pulls ~/.hermes/hermes-agent — its own running source — and then an
# atexit hook and a lazy tools/browser_tool.py import load the NEW
# hermes_cli/config.py against the STALE `utils` already in sys.modules, dying with
#
#   ImportError: cannot import name 'file_signature' from 'utils'
#
# *after* the update has landed. Verified 2026-09-15 on all three always-on hosts
# that had an update pending: `file_signature` IS defined at utils.py:38 on disk, a
# fresh interpreter imports hermes_cli.config fine, the checkout moved to 416a8177,
# and the next run reports "Already up to date". Left on `changed_when: true` with
# no `failed_when`, a *successful* update failed the play at task 150 of ~264 on
# every host that reaches this role — and then "passed" on the re-run only because
# there was nothing left to do, which is what disguised it as a transient.
#
# So diff the checkout revision instead, per CLAUDE.md "Self-update tasks: diff
# state, don't grep output" — the shape roles/codex uses for `codex update`. Probe
# with git, not `hermes --version`: the breakage is in Python imports, so a git
# probe cannot be taken down by the very thing being measured. Both probes carry
# `failed_when: false` so that `--check` on a host where the clone does not exist
# yet reads as "no change" rather than failing on a missing directory.
- name: Record the hermes checkout revision before updating # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: git rev-parse HEAD
    chdir: "{{ lookup('env', 'HOME') }}/.hermes/hermes-agent"
  register: hermes_rev_before
  changed_when: false
  failed_when: false

- name: Update hermes to the latest version
  ansible.builtin.command: "{{ lookup('env', 'HOME') }}/.local/bin/hermes update"
  when: "'Update available' in hermes_update_check.stdout"
  register: hermes_update
  changed_when: false
  failed_when: false

- name: Check whether hermes was updated # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: git rev-parse HEAD
    chdir: "{{ lookup('env', 'HOME') }}/.hermes/hermes-agent"
  register: hermes_rev_after
  changed_when: hermes_rev_after.stdout != hermes_rev_before.stdout
  failed_when: false

# The one genuine failure: the updater ran, errored, and the revision did NOT move,
# so nothing landed. Say so rather than converging over a failed update.
- name: Fail when a hermes update was attempted but nothing landed
  ansible.builtin.fail:
    msg: >-
      `hermes update` failed and the checkout is still at
      {{ hermes_rev_before.stdout | default('(unknown)', true) }} —
      {{ (hermes_update.stderr | default('', true)) | ternary(hermes_update.stderr, hermes_update.stdout | default('', true)) | truncate(400) }}
  when:
    - hermes_update is not skipped
    - hermes_update.rc | default(0) != 0
    - hermes_rev_after.stdout | default('', true) == hermes_rev_before.stdout | default('', true)
