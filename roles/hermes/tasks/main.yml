---
# Hermes is a long-running personal agent — it installs a uv-managed checkout, a
# Chromium for Playwright, and messaging gateways that are only useful while the
# machine is reachable. Like `openclaw`, it is gated on `mac_is_always_on`, set by
# the `host-facts` role (a meta dependency of this one) only when ioreg's
# AppleSmartBattery `BatteryInstalled` field exists and reads `No`. `Yes` (a
# MacBook) and a missing field (an Intel Mac, which publishes no
# AppleSmartBattery node at all) both skip; a VM is readmitted separately.
#
# The gate lives here rather than as a `when:` on the role in main.yml so it
# holds for a single-role run too. The meta dependency is what makes that run
# work with no extra vars — do not remove it.
- name: Install and update hermes
  ansible.builtin.include_tasks: install.yml
  when: mac_is_always_on | bool

# Defaulted as belt-and-braces, for the same reason as the openclaw role's
# message: the `host-facts` dependency always defines these two now, so the
# defaults only cover a play that reaches this task without that role.
# Safe for a display string, never for the gate above.
- name: Report that hermes was skipped
  ansible.builtin.debug:
    msg: >-
      Skipping hermes on this {{ mac_family | default('machine') }} —
      BatteryInstalled={{ mac_battery_installed | default('unknown') }}; the
      always-on agent is installed only where ioreg affirmatively reports No,
      or on a virtual machine.
  when: not (mac_is_always_on | bool)
