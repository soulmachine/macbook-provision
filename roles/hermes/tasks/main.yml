---
# Hermes is a long-running personal agent — it installs a uv-managed checkout, a
# Chromium for Playwright, and messaging gateways that are only useful while the
# machine is reachable. It is gated on `mac_is_always_on`, set by
# the `host-facts` role (a meta dependency of this one) on every Mac whose
# family does not start with "MacBook", and on any virtual machine.
#
# The gate lives here rather than as a `when:` on the role in main.yml so it
# holds for a single-role run too. The meta dependency is what makes that run
# work with no extra vars — do not remove it.
- name: Install and update hermes
  ansible.builtin.include_tasks: install.yml
  when: mac_is_always_on | bool

# Defaulted as belt-and-braces: the `host-facts` dependency always defines
# `mac_family`, so the default only covers a play that reaches this task
# without that role. Safe for a display string, never for the gate above.
- name: Report that hermes was skipped
  ansible.builtin.debug:
    msg: >-
      Skipping hermes on this {{ mac_family | default('machine') }} — the
      always-on agent is installed on every Mac except a MacBook.
  when: not (mac_is_always_on | bool)
