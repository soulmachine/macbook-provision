---
# macOS Local Network privacy refuses LAN connections from processes started outside ssh with
# EHOSTUNREACH, and Claude Code and other Team ID signed binaries never get a prompt to allow it
# (coding-agent Q640). Apple's system-wide address exception (TN3179) lets every process on this Mac
# reach the LAN hosts' IPs: ssh and the services by .local (coding-agent Q858, Q862).
# It lives in root's own com.apple.network.local-network domain (/var/root/Library/Preferences) and
# takes effect only after a reboot. Fleet rule: ~/coding-agent/devops/network-topology.md.
- name: Read the Local Network address exceptions
  ansible.builtin.command: defaults read com.apple.network.local-network {{ item }}
  become: true
  loop: [AllowedWiFiLocalNetworkAddresses, AllowedEthernetLocalNetworkAddresses]
  register: _hindsight_lna
  changed_when: false
  failed_when: false
  check_mode: false

- name: Allow the LAN hosts through Local Network privacy
  ansible.builtin.command: >-
    defaults write com.apple.network.local-network {{ item.0.item }} -array-add {{ item.1 }}/32
  become: true
  loop: "{{ _hindsight_lna.results | product(hindsight_lan_peers) | list }}"
  loop_control:
    label: "{{ item.0.item }} {{ item.1 }}"
  when: (item.1 ~ '/32') not in item.0.stdout
  changed_when: true
  notify: Report that the Local Network exception needs a reboot

# The LAN has no IPv6 router, so IPv6 there is link-local only, and its one effect was a fe80:: answer
# first for every .local name. Mac clients then connected over link-local: CLIProxyAPI logged an empty
# client IP and m2's pg_hba (192.168.31.0/24) refused them (coding-agent Q858). Only the hosts whose
# own IP is one of hindsight_lan_peers (not lume, which sits behind the Studio's NAT). Undo:
# networksetup -setv6automatic <service>. Tailscale's IPv6 is on its own interface and stays.
- name: Turn IPv6 off on the LAN network service
  ansible.builtin.shell: |
    set -o pipefail
    peers=" {{ hindsight_lan_peers | join(' ') }} "
    for d in $(ifconfig -l); do
      a=$(ipconfig getifaddr "$d" 2>/dev/null) || continue
      case $peers in *" $a "*) ;; *) continue;; esac
      svc=$(networksetup -listnetworkserviceorder | grep -B1 "Device: $d)" | head -1 | sed -E 's/^\([0-9*]+\) //')
      [ -n "$svc" ] || continue
      [ "$(networksetup -getinfo "$svc" | awk -F': ' '/^IPv6:/{print $2}')" = Off ] && continue
      networksetup -setv6off "$svc" && echo "changed $svc"
    done
  args:
    executable: /bin/bash
  become: true
  register: _hindsight_v6off
  changed_when: "'changed' in _hindsight_v6off.stdout"
  when: ansible_facts['all_ipv4_addresses'] | intersect(hindsight_lan_peers) | length > 0
