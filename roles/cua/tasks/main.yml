---
- name: Install cua-driver # noqa: command-instead-of-module risky-shell-pipe
  ansible.builtin.shell: /bin/bash -c "$(curl -fsSL https://cua.ai/driver/install.sh)"
  args:
    creates: "{{ cua_driver_bin }}"

# The install above never updates (`creates:`), which left the fleet on four
# versions from 0.22.1 to 0.32.0. `update --apply` runs the same installer and
# exits 0 whether it updated or not, so the verdict comes from diffing
# `--version`, as in the uv role. It checks GitHub's releases API
# unauthenticated, so a failed check is reported, not fatal. Grants survive an
# update: CuaDriver is Developer ID signed and TCC matches it by bundle id +
# team, not by binary (verified 0.28.2 -> 0.33.4 on 2026-10-05).
- name: Record the cua-driver version before updating
  ansible.builtin.command: "{{ cua_driver_bin }} --version"
  register: _cua_version_before
  changed_when: false
  check_mode: false

- name: Update cua-driver
  ansible.builtin.command: "{{ cua_driver_bin }} update --apply"
  register: _cua_update
  changed_when: false
  failed_when: false

- name: Check whether cua-driver was updated
  ansible.builtin.command: "{{ cua_driver_bin }} --version"
  register: _cua_version_after
  changed_when: _cua_version_after.stdout != _cua_version_before.stdout
  check_mode: false

- name: Warn that cua-driver could not check for an update
  ansible.builtin.debug:
    msg:
      - "`cua-driver update --apply` exited {{ _cua_update.rc }}; {{ _cua_version_after.stdout }} is still installed."
      - "Most likely the unauthenticated GitHub API rate limit (60/hr per IP) is spent."
      - "Diagnose: run `cua-driver update --apply` by hand to see its own error."
  when: _cua_update.rc | default(0) != 0

# The installer asks for the old daemon to be restarted onto the new binary.
- name: Stop the cua-driver daemon running the old version
  ansible.builtin.command: "{{ cua_driver_bin }} stop"
  when: _cua_version_after.stdout != _cua_version_before.stdout
  changed_when: false
  failed_when: false

# `permissions status` can only answer through a running daemon, and nothing
# restarts one after a reboot (cua-driver's `autostart` is Windows-only). That
# alone failed the gate on four granted hosts on 2026-10-05. So start one
# before asking, with the command cua-driver's own error message gives. There
# is deliberately no LaunchAgent; the daemon lives until the next reboot and
# the next run starts it again (DECISIONS Q180). `status` has no --json, and
# 0.33.4 may print a telemetry notice first, so match the text anywhere.
- name: Read whether the cua-driver daemon is running
  ansible.builtin.command: "{{ cua_driver_bin }} status"
  register: _cua_daemon
  changed_when: false
  failed_when: false
  check_mode: false

# failed_when: false keeps a host with no GUI session from stopping the play
# here; the permissions read below then reports the daemon missing, and the
# post_task fails the play with that state in its message.
- name: Start the cua-driver daemon so its permissions can be read
  ansible.builtin.command: open -n -g -a CuaDriver --args serve
  register: _cua_start
  when: "'daemon is running' not in _cua_daemon.stdout"
  changed_when: _cua_start.rc == 0
  failed_when: false

# jev-use (https://github.com/trycua/cua/blob/main/docs/content/docs/how-to-guides/driver/jev-use.mdx)
# "Step 1: Verify Cua Driver" requires Accessibility AND Screen Recording both
# granted to CuaDriver.app before anything downstream can drive the desktop.
# `permissions status` only answers via a running daemon (reports `unknown`
# otherwise) and never itself prompts; `permissions grant` is cua-driver's own
# documented, correct way to request them — it launches the app via
# LaunchServices and drives OS consent dialogs. That's a GUI flow no Ansible
# task can click through, so the play fails with the exact remedy command
# instead of trying to automate it.
#
# This role only RECORDS the missing grant; main.yml's post_tasks is what fails
# the play on it (DECISIONS Q178). It used to `fail` right here, and this role
# sits 28th of 49, so one ungranted host skipped the 21 roles after it —
# hermes, ponytail, paseo and tailscale among them — every night: the 2018
# mini went about ten days without them (2026-09-25 to 10-05). Deferring keeps
# the signal (the recap still says failed=1, which the nightly sweep greps for)
# and drops the blast radius to nothing — the same split the skills and paseo
# roles use.
- name: Read cua-driver permissions status
  ansible.builtin.command: "{{ cua_driver_bin }} permissions status --json"
  register: _cua_permissions
  changed_when: false
  failed_when: false
  check_mode: false # read-only probe; run in --check so the guard below sees real state
  # A daemon started a moment ago takes a few seconds to answer, and until it
  # does the payload carries no "accessibility" key.
  until: "'\"accessibility\"' in _cua_permissions.stdout"
  retries: 10
  delay: 3

- name: Decide whether cua-driver has the permissions jev-use needs
  vars:
    _cua_status: "{{ _cua_permissions.stdout | default('{}', true) | from_json }}"
  ansible.builtin.set_fact:
    cua_permissions_granted: >-
      {{ (_cua_status.accessibility | default(false, true) | bool)
         and (_cua_status.screen_recording | default(false, true) | bool) }}

# A host fact, not a role var, so main.yml's post_tasks can read it. Defined
# only when a grant is missing, which is what the post_task tests.
- name: Record that cua-driver lacks the permissions jev-use needs
  ansible.builtin.set_fact:
    cua_permissions_missing: |

      ================================================================
      Manual step required: grant cua-driver Accessibility + Screen Recording
      ================================================================

      jev-use needs cua-driver's Accessibility and Screen Recording
      permissions, and `cua-driver permissions status` does not report
      them granted yet.

      Run this yourself — it launches CuaDriver and walks you through the
      OS consent dialogs:

        cua-driver permissions grant

      Then re-run: ansible-playbook main.yml

      State reported by `cua-driver permissions status --json`:
        {{ _cua_permissions.stdout | trim | default('(no output)', true) }}
      ================================================================
  when: not (cua_permissions_granted | bool)

# post_tasks only run in a full play, so a single-role run would never see the
# failure there. The skills and paseo roles report their deferred failures the
# same way.
- name: Report that cua-driver lacks its permissions
  ansible.builtin.debug:
    msg: "{{ cua_permissions_missing }}"
  when: cua_permissions_missing is defined

- name: Clone the jev-use example # noqa: latest[git]
  ansible.builtin.git:
    repo: https://github.com/trycua/cua.git
    dest: "{{ cua_jevuse_dir }}"
    version: HEAD
    depth: 1
    update: false # pinned example checkout, not a tracked upstream tool

- name: Sync the jev-use example's Python environment
  ansible.builtin.command: "{{ cua_home }}/.local/bin/uv sync --frozen --python 3.12"
  args:
    chdir: "{{ cua_jevuse_example_dir }}"
    creates: "{{ cua_jevuse_venv }}"

# jev-use's remaining steps — the no-key browser-connection check and the
# live Jev run — are per-run usage, not install: each needs a fresh
# --output-dir, and the live run needs an interactively-supplied
# TYPESAFE_API_KEY. Run those by hand from {{ cua_jevuse_example_dir }} per
# the doc; they're deliberately not scripted here.
