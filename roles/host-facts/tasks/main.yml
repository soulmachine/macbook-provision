---
# Classify this Mac so the always-on-only roles can gate on it. This role
# installs nothing — it exists only to set three facts, which makes it the one
# role in the repo with no install step. Every task is a read-only probe or a
# set_fact, so it reports 0 changed and stays clean under the idempotency check.
#
# It is wired two ways, both deliberate:
#   - as a `meta/main.yml` dependency of hermes and ponytail, so a
#     standalone `ansible localhost -m include_role -a name=hermes`
#     classifies the machine itself and needs no `-e mac_is_always_on=...`;
#   - listed first in main.yml's `roles:`, so the full play classifies before
#     any role runs, however that list is later reordered.
# Ansible de-duplicates a parameterless role, so it runs exactly ONCE per play
# either way. Do not give either wiring a `vars:` block — that breaks dedup and
# the probes run twice.
#
# These are `command`/`shell` TASKS, not `lookup('pipe', ...)` vars, on purpose.
# Ansible evaluates every lookup on the CONTROL node, so a lookup here would let
# the control node's hardware decide what a target installs — a worse bug than
# the `lookup('env', 'HOME')` debt CLAUDE.md already tracks, and one with no
# `ansible_*` equivalent to migrate to. See "Runs per-host only, never from a
# control node".
#
# `set_fact` rather than `vars/main.yml` is also load-bearing: role vars are
# scoped to the role, host facts are global — which is what lets hermes read
# these from a dependency. Do not "simplify" it into vars/main.yml later.
#
# This role carries no tags. A `--tags`-limited play that reached a gated role
# would abort on the undefined gate. No tag reaches one today
# (`agent-multiplexer` is paseo/moshi, `terminal-multiplexer` is
# zellij/tmux/herdr); if a gated role ever gains a tag, add `tags: always` here.

# Classify the machine before any role runs, so always-on-only roles can gate
# on it. A role that stands up a long-lived local service (hermes; openclaw's
# gateway until its fleet-wide removal on 2026-09-08) is worth installing only
# on a Mac that is actually up.
#
# The gate is the model family, and it is a MacBook blacklist:
#   a virtual machine        — always-on. Install.
#   `mac_family` "MacBook…"  — a laptop sleeps, roams networks, and is not run
#                              24x7. Skip. The prefix covers MacBook, MacBook
#                              Air and MacBook Pro.
#   anything else            — Mac mini, Mac Studio, Mac Pro, iMac, and any
#                              family nobody has seen yet. Install.
#
# This is deliberately fail-OPEN, reversing the earlier ioreg `BatteryInstalled`
# gate, which installed only where the hardware affirmatively reported no
# battery and so skipped the Intel franks-mac-mini-2018 (its ioreg tree has no
# battery node at all). The user chose the family rule on 2026-10-04 (DECISIONS
# Q171) knowing it admits that mini. The VM branch is redundant today — no VM's
# family starts with "MacBook" — and is kept because the rule was asked for in
# that shape.
#
# The family comes from `system_profiler`'s `machine_name`, the marketing name.
# (`sysctl -n hw.model` is no help — every Apple Silicon Mac reports the
# family-less `MacN,M` form: the Mac mini M2 is `Mac14,3`, the MacBook Air M4
# `Mac16,12`.)
#
# Override a host that should defy its hardware with `-e mac_is_always_on=true`
# (or `=false`); extra vars outrank set_fact. Every gate casts with `| bool`
# because `-e` delivers a bare string — and `not "false"` is False, so an
# uncast gate would do the opposite of what the override asked.
#
# check_mode: false on the probe — command modules skip under `--check`,
# which would leave the register undefined and break the set_fact below. It
# is read-only, so running it during a dry run is safe and is what makes the
# gates meaningful there.

- name: Read hardware overview
  ansible.builtin.command: system_profiler -json SPHardwareDataType
  register: mac_hw
  changed_when: false
  check_mode: false

# `mac_family` is the marketing name — "Mac mini", "Mac Studio",
# "MacBook Air", "Apple Virtual Machine 1". It feeds the verdict below and the
# skip message that explains it.
#
# `mac_is_vm` re-parses the JSON rather than reading `mac_family` because a
# `set_fact` CANNOT reference a key defined in the same task — Ansible fails
# the play with "Error while resolving value ... is undefined". That is also
# why the verdict lives in a second task rather than a third key here.
- name: Classify this Mac
  ansible.builtin.set_fact:
    mac_family: "{{ (mac_hw.stdout | from_json).SPHardwareDataType[0].machine_name }}"
    mac_is_vm: "{{ 'Virtual' in (mac_hw.stdout | from_json).SPHardwareDataType[0].machine_name }}"

- name: Decide whether this Mac is always-on
  ansible.builtin.set_fact:
    mac_is_always_on: "{{ mac_is_vm or not mac_family.startswith('MacBook') }}"
