---
openclaw_home: "{{ lookup('env', 'HOME') }}"

# The npm packages the old install task put in (`openclaw` and its ClawHub
# companion CLI), and the Homebrew cask carrying the OpenClaw.app companion.
openclaw_npm_packages:
  - openclaw
  - clawhub
openclaw_cask: openclaw

# OpenClaw's own state, deliberately NOT removed by this role — ~/.openclaw is
# gigabytes of sessions, memory, credentials and workspace skills, and the rest
# is the app's preferences and caches. Reported at the end so a human can purge
# them knowingly.
openclaw_data_dirs:
  - "{{ openclaw_home }}/.openclaw"
  - "{{ openclaw_home }}/Library/Application Support/OpenClaw"
  - "{{ openclaw_home }}/Library/Logs/openclaw"
  - "{{ openclaw_home }}/Library/Caches/openclaw"
  - "{{ openclaw_home }}/Library/Caches/ai.openclaw.mac"
  - "{{ openclaw_home }}/Library/Preferences/ai.openclaw.mac.plist"
  - "{{ openclaw_home }}/Library/Preferences/ai.openclaw.shared.plist"
