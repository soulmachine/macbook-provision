---
# OpenClaw is installed only on archs-mac-mini, whose live gateway (Telegram, Slack, ArchAuto's
# invoice watcher) needs this role to rewrite its daemon after a Node upgrade. Every other host had
# it removed on 2026-11-06 (coding-agent Q1056). The gate lives here so it holds for a single-role
# run too.
- name: Install OpenClaw
  ansible.builtin.include_tasks: install.yml
  when: lookup('pipe', 'hostname -s') == 'archs-mac-mini'

- name: Report that OpenClaw was skipped
  ansible.builtin.debug:
    msg: "Skipping OpenClaw on {{ lookup('pipe', 'hostname -s') }}: only archs-mac-mini runs it."
  when: lookup('pipe', 'hostname -s') != 'archs-mac-mini'
