---
# OpenClaw is a gateway: `openclaw` installs a LaunchAgent that holds a local
# port open and brokers sessions for other machines. That only earns its keep on
# a Mac that is actually up — so this role is gated on `mac_is_always_on`, set by
# the `host-facts` role (a meta dependency of this one) only when ioreg's
# AppleSmartBattery `BatteryInstalled` field exists and reads `No`. `Yes` (a
# MacBook) and a missing field (an Intel Mac, which publishes no
# AppleSmartBattery node at all) both skip; a VM is readmitted separately. Today
# that installs on the Apple Silicon desktops and the lume VM.
#
# The gate lives here rather than as a `when:` on the role in main.yml so it
# holds for every entry point: the full play, a single-role
# `ansible localhost -m include_role -a name=openclaw`, and `claude-mem`, which
# depends on this role. The meta dependency is what makes the standalone run
# work with no extra vars — do not remove it.
- name: Install and configure OpenClaw
  ansible.builtin.include_tasks: install.yml
  when: mac_is_always_on | bool

# `mac_family` / `mac_battery_installed` are defaulted as belt-and-braces. The
# `host-facts` dependency now always defines them, so these defaults no longer
# carry the standalone run — they only cover a play that somehow reaches this
# task without that role (a future `--tags`-limited run, say), where the message
# would otherwise abort with "Error while resolving value for 'msg'".
# Defaulting stays safe here and stays WRONG on the gate above: these two shape
# only the wording, where a defaulted gate would silently change what installs.
- name: Report that OpenClaw was skipped
  ansible.builtin.debug:
    msg: >-
      Skipping OpenClaw on this {{ mac_family | default('machine') }} —
      BatteryInstalled={{ mac_battery_installed | default('unknown') }}; the
      always-on gateway is installed only where ioreg affirmatively reports No,
      or on a virtual machine.
  when: not (mac_is_always_on | bool)
