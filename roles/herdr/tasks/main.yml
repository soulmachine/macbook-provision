---
# herdr — multiplexer that lives in your terminal. Shipped as the Homebrew core
# formula `herdr` (no tap needed). https://herdr.dev
#
# NOTE: a non-Homebrew herdr may already exist at ~/.local/bin/herdr, which
# precedes /opt/homebrew/bin on PATH and would shadow this brew-installed copy.
# The tasks after the install prune that shadow once it falls behind the formula.

- name: Install herdr
  community.general.homebrew:
    name: herdr
    state: latest

# Upstream's install script, `herdr update`, and the far side of `herdr --remote`
# all write the binary to ~/.local/bin/herdr, and ~/.zprofile prepends that
# directory ahead of the Homebrew prefix — so a self-installed copy silently
# outranks the one installed above, and brew goes on upgrading a binary nobody
# executes.
#
# What that costs is the pin, not the duplicate: the shadow stays frozen at
# whatever version was written while brew moves on. A 0.5.9 from May 2026
# outranked brew's 0.8.2 here until August, which is why double-click-to-copy —
# an 0.8.x feature — read as missing rather than merely out of date.
#
# Only an older copy is pruned. `herdr --remote` installs a version-matched
# binary on the target on purpose, so the remote server speaks the local client's
# protocol, and a newer one is someone deliberately running ahead of the formula.
# Deleting either would lose a race with the tool putting it straight back, and
# the role would never converge; both settle on their own once brew ships past
# them.
- name: Get the Homebrew herdr version
  ansible.builtin.command: brew list --versions herdr
  register: herdr_brew_version
  changed_when: false
  # Prints nothing and exits 1 when the formula is not installed. Tolerating that
  # is what stops a machine whose brew install has not landed from having its
  # only herdr deleted below.
  failed_when: false

# shell rather than command so an absent shadow is empty stdout instead of a task
# failure, which keeps the prune below down to plain version tests.
- name: Get the version of any self-installed herdr in ~/.local/bin
  ansible.builtin.shell: |
    [ -x "$HOME/.local/bin/herdr" ] || exit 0
    "$HOME/.local/bin/herdr" --version
  register: herdr_local_version
  changed_when: false

# Both commands print "herdr <semver>"; match the number rather than splitting on
# whitespace, so a future suffix such as a channel name cannot feed a non-version
# into the comparison and abort the play.
- name: Remove the self-installed herdr once it falls behind the Homebrew one
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/bin/herdr"
    state: absent
  register: herdr_shadow_pruned
  vars:
    herdr_brew_semver: "{{ herdr_brew_version.stdout | regex_search('[0-9]+[.][0-9]+[.][0-9]+') | default('', true) }}"
    herdr_local_semver: "{{ herdr_local_version.stdout | regex_search('[0-9]+[.][0-9]+[.][0-9]+') | default('', true) }}"
  when:
    - herdr_brew_semver | length > 0
    - herdr_local_semver | length > 0
    - herdr_local_semver is version(herdr_brew_semver, '<')

# Removing the file leaves an already-running server on its open inode, so the
# machine keeps serving the shadowed version until herdr restarts. Say so, rather
# than letting a green playbook imply the upgrade has already taken effect.
#
# noqa no-handler: a handler is the idiom for "restart the thing", but it fires at
# the end of the whole play — dozens of roles downstream of this one — and is
# skipped outright if any of them fail. A notice about what just happened here
# belongs here, so this stays a task gated on the prune.
- name: Report that a running herdr still needs a restart # noqa: no-handler
  ansible.builtin.debug:
    msg: >-
      Removed the shadowed ~/.local/bin/herdr ({{ herdr_local_version.stdout }});
      `herdr` now resolves to the Homebrew build ({{ herdr_brew_version.stdout }}).
      A herdr server that is already running stays on the old binary until it is
      restarted — detach, then `pkill -f 'herdr server'` and relaunch.
  when: herdr_shadow_pruned is changed

# Multi-line, so blockinfile rather than the lineinfile used for one-line aliases
# elsewhere. The named marker keeps this block from colliding with any other
# role's managed block in the same .zshrc.
- name: Add the herdr terminal-title wrapper to .zshrc
  ansible.builtin.blockinfile:
    path: "{{ lookup('env', 'HOME') }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: herdr"
    state: present
    block: |
      # herdr: title the terminal "herdr <hostname>" instead of just "herdr".
      # The bare "herdr" title comes from oh-my-zsh/ghostty preexec; herdr itself never
      # sets a title, so retitling here after preexec sticks for the whole session.
      herdr() {
        printf '\e]0;herdr %s\a' "${HOST%%.*}"
        command herdr "$@"
      }

# Two tasks keep this both idempotent and fresh: `add` installs once (guarded by
# `creates`, so it no-ops once the skill exists), and `update` re-checks upstream
# every run — reporting `changed` only when the SKILL.md actually moves.
- name: Install the herdr skill (teaches the agent to control Herdr from inside a Herdr pane)
  ansible.builtin.command:
    cmd: npx skills add herdrdev/herdr --skill herdr -g -y
    creates: "{{ lookup('env', 'HOME') }}/.agents/skills/herdr"

# `skills update` exits 0 no matter what happens and only prints "…up to date"
# on one of its several no-change paths. It stays silent about being current
# when a source is skipped, when there is nothing global to check, and — most
# often here — when the check itself fails ("Failed to check skills from …"),
# which is routine because the unauthenticated GitHub API allows just 60 calls
# an hour and the git-clone fallback is its own failure surface. Matching on the
# phrase therefore reports a phantom change whenever the quota runs dry, so
# checksum the installed skill around the call and let the files decide.
- name: Fingerprint the herdr skill before updating
  ansible.builtin.find:
    paths: "{{ lookup('env', 'HOME') }}/.agents/skills/herdr"
    recurse: true
    file_type: file
    get_checksum: true
  register: herdr_skill_before

- name: Keep the herdr skill up to date from upstream
  ansible.builtin.command:
    cmd: npx skills update herdr -g -y
  register: herdr_skill_update
  changed_when: false

# `skills add` records the skill's upstream path in ~/.agents/.skill-lock.json at
# install time and never revisits it. When upstream moves the file — herdr went
# from a root SKILL.md to skills/herdr/SKILL.md — the lock keeps pointing at the
# old path, so `skills update` finds nothing there, calls the skill "deleted
# upstream", declines to act on it in non-interactive mode, and the skill
# silently freezes at its last-good version. This one sat unchanged from
# 2026-07-02 to 2026-08-20 that way. Re-running `add` is what rewrites the path,
# and the `creates:` guard above will never do it, so trigger it from the
# warning. Matching a phrase is defensible here in a way it was not for
# `changed_when`: this is a positive sentinel on exactly one branch, and a missed
# match leaves a stale skill rather than inventing a change that never happened.
- name: Re-add the herdr skill when upstream has moved its path
  ansible.builtin.command:
    cmd: npx skills add herdrdev/herdr --skill herdr -g -y
  when: "'deleted upstream' in herdr_skill_update.stdout"
  # Reaching this task means the drift was detected, and running it rewrites the
  # lock entry, so the repair is a real change even when the skill's own files
  # come back byte-identical. The checksum task below reports content separately.
  changed_when: true

- name: Check whether the herdr skill was updated
  ansible.builtin.find:
    paths: "{{ lookup('env', 'HOME') }}/.agents/skills/herdr"
    recurse: true
    file_type: file
    get_checksum: true
  register: herdr_skill_after
  changed_when: >-
    (herdr_skill_after.files | map(attribute='checksum') | sort)
    != (herdr_skill_before.files | map(attribute='checksum') | sort)

- name: Symlink ~/.claude/skills/herdr to ~/.agents/skills/herdr
  ansible.builtin.file:
    src: "{{ lookup('env', 'HOME') }}/.agents/skills/herdr"
    dest: "{{ lookup('env', 'HOME') }}/.claude/skills/herdr"
    state: link
    force: true
