---
# mise is installed once by bootstrap.sh (standalone, into ~/.local/bin/mise) and, until this
# role existed, by nothing else ever again — bootstrap runs on a fresh Mac and not after. The
# fleet had drifted to four different versions spanning six months when this was measured on
# 2026-09-16: mac-mini-2018 on 2026.3.17, mac-mini-m2 on 2026.4.3, macbook-pro-nickel on
# 2026.5.2, dev-server-frank-lume on 2026.8.8. That is the same silent freeze the self-update
# roles exist to prevent, one layer down — and mise is the layer `go`, `jdk` and `nodejs` all
# stand on.
#
# `mise self-update` is the right updater precisely because the install is standalone: its own
# help says the command "is not available if mise is installed via a package manager", and no
# fleet host has mise from brew (`brew list --formula | grep -x mise` finds nothing). A host
# that ever switches to the brew build will fail this command rather than silently do nothing,
# which the warning task at the bottom reports.
#
# Bare `mise`, not an absolute path: that is what `go`, `jdk` and `nodejs` already use, and
# ~/.local/bin is on the non-interactive PATH via each host's ~/.zshenv.

# Same GitHub rate-limit problem the bun role documents: self-update resolves the newest
# release through the GitHub API, which allows 60 calls an hour *per IP* shared with every
# other tool here, so the budget is routinely spent. mise reads GITHUB_API_TOKEN — not
# GITHUB_TOKEN, which is what bun reads — so the variable name below is deliberate.
#
# Both GH_TOKEN and GITHUB_TOKEN are blanked for the lookup because gh resolves in the order
# GH_TOKEN, GITHUB_TOKEN, keyring: leaving either set makes `gh auth token` echo back the very
# value the fallback exists to replace, and a stale one then fails 401 instead of 403.
- name: Read the GitHub token stored by gh
  ansible.builtin.command: gh auth token
  environment:
    GH_TOKEN: ""
    GITHUB_TOKEN: ""
  register: mise_gh_token
  changed_when: false
  failed_when: false
  no_log: true

- name: Record the mise version before updating
  ansible.builtin.command: mise --version
  register: mise_version_before
  changed_when: false

# `--no-plugins` keeps what this command changes aligned with what the gate below measures.
# By default self-update also updates installed plugins, which `mise --version` does not
# report — so a plugin-only update would be a change this role performed and reported as `ok`,
# the missed-change failure the npm and rustup gates were fixed for (Q123, Q124). No fleet
# host has any plugin installed today (`mise plugins ls` is empty everywhere; the go/java/node
# backends are built in), so this narrows nothing in practice and keeps the gate honest if
# that ever changes.
#
# `-y` because there is a confirmation prompt and nothing here can answer it.
#
# failed_when: false, not ignore_errors: true — a spent rate limit is an expected outcome, and
# a red `fatal:` block on a converged run trains you to skim past red. The warning task below
# says the same thing without crying wolf.
- name: Update mise to the latest release
  ansible.builtin.command: mise self-update --yes --no-plugins
  environment:
    GITHUB_API_TOKEN: "{{ lookup('env', 'GITHUB_TOKEN') | trim or (mise_gh_token.stdout | trim if mise_gh_token.rc == 0 else '') }}"
  register: mise_self_update
  changed_when: false
  failed_when: false
  no_log: true

# Decide `changed` from the observable version, per CLAUDE.md "Self-update tasks: diff state,
# don't grep output". self-update prints its own wording on every path and exits 0 whether or
# not it moved, so no phrase in that output separates the two.
- name: Check whether mise was updated
  ansible.builtin.command: mise --version
  register: mise_version_after
  changed_when: mise_version_after.stdout != mise_version_before.stdout

- name: Warn that mise could not check for a newer release
  ansible.builtin.debug:
    msg:
      - "`mise self-update` exited {{ mise_self_update.rc }} — mise {{ mise_version_after.stdout }} is installed and working,"
      - "but it could not confirm whether a newer release exists, so this host may be pinned to an old mise."
      - "Most likely the unauthenticated GitHub API rate limit (60/hr per IP) is spent; check with `curl -s https://api.github.com/rate_limit`."
      - "If mise was reinstalled from Homebrew, self-update refuses by design — use `brew upgrade mise` and drop this role for that host."
      - "Diagnose: run `mise self-update --yes --no-plugins` by hand to see mise's own error."
  when: mise_self_update.rc != 0
