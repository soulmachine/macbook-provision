---
# Codex ships inside ChatGPT.app, which keeps it current by updating itself, so this role
# installs the `chatgpt` cask and links `codex` to that copy: no codex cask, no npm. The codex
# cask ran `codex completion` on every upgrade, and on some hosts that first launch stopped on
# a Gatekeeper prompt nobody was there to click (2026-10-08, DECISIONS Q197). bin/codex is the
# entrypoint the bundle's codex-package.json names. The cask has an Intel (x64) build with
# codex at the same path, so this runs on every host, mac-mini-2018 included (DECISIONS Q200).
# --adopt takes over a ChatGPT.app installed by hand instead of failing on "already an App";
# the cask sets auto_updates, so brew adopts it without comparing versions.
- name: Install ChatGPT.app, which carries the Codex CLI
  community.general.homebrew_cask:
    name: chatgpt
    state: present
    install_options: adopt

- name: Link codex to the copy inside ChatGPT.app
  ansible.builtin.file:
    src: "{{ codex_chatgpt_cli }}"
    dest: "{{ lookup('env', 'HOME') }}/.local/bin/codex"
    state: link
    force: true

# After the link, so `codex` never goes missing between the two.
- name: Remove the Codex cask
  community.general.homebrew_cask:
    name: codex
    state: absent

# --- open-pstack (retired) ---------------------------------------------------
# Removed fleet-wide in Q247. The `[marketplaces.*]` / `[plugins."*"]` sections in
# config.toml are the markers. Delete this block once every host is clean.
#
# no_log on both: config.toml carries API keys in `[mcp_servers.*.env]`, and an ad-hoc
# `include_role` run prints every result in full, base64 being no protection.
- name: Read the Codex config
  ansible.builtin.slurp:
    src: "{{ codex_home }}/config.toml"
  register: codex_config_raw
  failed_when: false
  no_log: true

- name: Decode the Codex config
  ansible.builtin.set_fact:
    codex_config: "{{ codex_config_raw.content | default('') | b64decode }}"
  no_log: true

- name: Remove the retired pstack Codex plugin
  ansible.builtin.command: codex plugin remove pstack@open-pstack
  when: "'[plugins.\"pstack@open-pstack\"]' in codex_config"
  changed_when: true

- name: Remove the retired open-pstack Codex marketplace
  ansible.builtin.command: codex plugin marketplace remove open-pstack
  when: "'[marketplaces.open-pstack]' in codex_config"
  changed_when: true

# `codex plugin remove` leaves the plugin's hook-trust entry behind.
- name: Remove the retired pstack hook-trust entry
  ansible.builtin.replace:
    path: "{{ codex_home }}/config.toml"
    regexp: '^\[hooks\.state\."pstack@open-pstack:[^\n]*\n(?:[^\[\n][^\n]*\n)*\n?'
    replace: ""
  when: "'[hooks.state.\"pstack@open-pstack:' in codex_config"
  no_log: true

- name: Add codex-yolo alias to .zshrc
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.zshrc"
    line: 'alias codex-yolo="codex --yolo -c model_reasoning_effort=high"'
    regexp: '^alias codex-yolo='
    state: present
