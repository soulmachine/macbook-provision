---
# Codex ships inside ChatGPT.app, which keeps it current by updating itself, so this role
# installs the `chatgpt` cask and links `codex` to that copy: no codex cask, no npm. The codex
# cask ran `codex completion` on every upgrade, and on some hosts that first launch stopped on
# a Gatekeeper prompt nobody was there to click (2026-10-08, DECISIONS Q197). bin/codex is the
# entrypoint the bundle's codex-package.json names. The cask has an Intel (x64) build with
# codex at the same path, so this runs on every host, mac-mini-2018 included (DECISIONS Q200).
# --adopt takes over a ChatGPT.app installed by hand instead of failing on "already an App";
# the cask sets auto_updates, so brew adopts it without comparing versions.
- name: Install ChatGPT.app, which carries the Codex CLI
  community.general.homebrew_cask:
    name: chatgpt
    state: present
    install_options: adopt

- name: Link codex to the copy inside ChatGPT.app
  ansible.builtin.file:
    src: "{{ codex_chatgpt_cli }}"
    dest: "{{ lookup('env', 'HOME') }}/.local/bin/codex"
    state: link
    force: true

# After the link, so `codex` never goes missing between the two.
- name: Remove the Codex cask
  community.general.homebrew_cask:
    name: codex
    state: absent

- name: Add codex-yolo alias to .zshrc
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.zshrc"
    line: 'alias codex-yolo="codex --yolo -c model_reasoning_effort=high"'
    regexp: '^alias codex-yolo='
    state: present
